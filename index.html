<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SAEMove + Transports IDF</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f172a;color:#f1f5f9;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#topbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#1e293b;border-bottom:1px solid #334155;flex-wrap:wrap;flex-shrink:0;z-index:500}
#topbar h1{font-size:13px;font-weight:700;color:#f8fafc;margin-right:4px;white-space:nowrap}
.sep{width:1px;height:22px;background:#334155;margin:0 3px}
.lbtn{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:16px;border:2px solid transparent;cursor:pointer;font-size:11px;font-weight:600;transition:all .2s;user-select:none;white-space:nowrap}
.lbtn.on{opacity:1}.lbtn.off{opacity:0.3;filter:grayscale(1)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
#filterbar{display:flex;align-items:center;gap:6px;padding:5px 12px;background:#1a2540;border-bottom:1px solid #2d3e5a;flex-shrink:0;flex-wrap:wrap}
#filterbar label{font-size:11px;color:#94a3b8;font-weight:600}
.fbtn{padding:3px 9px;border-radius:12px;border:1.5px solid #334155;background:#0f172a;color:#cbd5e1;font-size:11px;cursor:pointer;transition:all .15s;font-weight:500}
.fbtn.active{background:#3b82f6;border-color:#3b82f6;color:#fff}
#search{padding:3px 8px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#f1f5f9;font-size:11px;width:170px;margin-left:auto}
#search::placeholder{color:#475569}
#map{flex:1;min-height:0}
#panel{position:absolute;top:50%;right:14px;transform:translateY(-50%);width:270px;max-height:72vh;overflow-y:auto;background:rgba(15,23,42,0.97);border:1px solid #334155;border-radius:10px;z-index:1000;display:none;padding:14px;font-size:12px}
#panel h3{font-size:13px;font-weight:700;margin-bottom:8px;color:#f8fafc}
.pclose{float:right;cursor:pointer;color:#64748b;font-size:16px;line-height:1;margin-top:-2px}
.stop-row{display:flex;justify-content:space-between;align-items:flex-start;padding:4px 0;border-bottom:1px solid #1e293b;gap:8px}
.stop-row:last-child{border:none}
.sname{color:#e2e8f0;line-height:1.3}.stime{color:#94a3b8;white-space:nowrap;font-size:11px}
.badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700;margin-bottom:5px}
#legend{position:absolute;bottom:28px;left:10px;z-index:1000;background:rgba(15,23,42,0.95);border:1px solid #334155;border-radius:8px;padding:8px 10px;font-size:10px;max-height:40vh;overflow-y:auto;min-width:155px;max-width:195px}
#legend h4{color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;font-size:9px;margin-top:6px}
#legend h4:first-child{margin-top:0}
.li{display:flex;align-items:center;gap:6px;padding:2px 0;color:#cbd5e1;cursor:pointer;line-height:1.3}
.li:hover{color:#fff}
.lc{width:20px;height:3px;border-radius:2px;flex-shrink:0}
.leaflet-tooltip{background:rgba(15,23,42,0.95)!important;color:#f1f5f9!important;border:1px solid #334155!important;border-radius:6px!important;font-size:11px!important;padding:4px 8px!important;box-shadow:0 2px 8px rgba(0,0,0,.5)!important}
.leaflet-tooltip::before{display:none!important}
</style>
</head>
<body>
<div id="topbar">
  <h1>🚌 SAEMove + IDF</h1>
  <div class="sep"></div>
  <button class="lbtn on" id="btn-safran" style="background:#422006;border-color:#f59e0b;color:#fbbf24" onclick="toggleLayer('safran',this)">
    <span class="dot" style="background:#f59e0b"></span>Navettes SAE</button>
  <button class="lbtn on" id="btn-rer" style="background:#2e1065;border-color:#a855f7;color:#d8b4fe" onclick="toggleLayer('rer',this)">
    <span class="dot" style="background:#a855f7"></span>RER</button>
  <button class="lbtn on" id="btn-trans" style="background:#022c22;border-color:#10b981;color:#6ee7b7" onclick="toggleLayer('trans',this)">

  <button class="lbtn on" id="btn-metro" style="background:#172554;border-color:#3b82f6;color:#93c5fd" onclick="toggleLayer('metro',this)">
    <span class="dot" style="background:#3b82f6"></span>Métro</button>
</div>
<div id="filterbar">
  <label>Direction:</label>
  <button class="fbtn active" onclick="setFilter('dir','all',this)">Tout</button>
  <button class="fbtn" onclick="setFilter('dir','aller',this)">↗ Aller</button>
  <button class="fbtn" onclick="setFilter('dir','retour',this)">↙ Retour</button>
  <div class="sep"></div>
  <label>Type:</label>
  <button class="fbtn active" onclick="setFilter('type','all',this)">Tout</button>
  <button class="fbtn" onclick="setFilter('type','normale',this)">🟡 Normale</button>
  <button class="fbtn" onclick="setFilter('type','equipe',this)">🔵 Équipe</button>
  <input id="search" type="text" placeholder="Chercher ligne ou arrêt…" oninput="onSearch(this.value)"/>
</div>
<div id="map"></div>
<div id="panel">
  <span class="pclose" onclick="closePanel()">✕</span>
  <h3 id="ptitle"></h3>
  <div id="pbody"></div>
</div>
<div id="legend">

</div>

// ── MAP ───────────────────────────────────────────────────────────────────────
const map = L.map('map',{zoomControl:true,preferCanvas:true}).setView([48.72,2.55],9);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);

const groups={safran:L.layerGroup().addTo(map),rer:L.layerGroup().addTo(map),
              trans:L.layerGroup().addTo(map),metro:L.layerGroup().addTo(map)};
const layerVis={safran:true,rer:true,trans:true,metro:true};
const filters={dir:'all',type:'all',search:''};
let saeItems=[];

// ── GENERIC LINE DRAWER ───────────────────────────────────────────────────────
function drawStaticLines(dataset, group, legendEl, labelPrefix, weight, dashArray){
  Object.entries(dataset).forEach(function([name,data]){
    const coords=data.stops.map(s=>[s.lat,s.lng]);
    const poly=L.polyline(coords,{color:data.color,weight:weight,opacity:0.85,
      dashArray:dashArray||null,interactive:true});
    poly.bindTooltip(labelPrefix+name,{sticky:true,direction:'top'});
    poly.on('click',function(){showStaticPanel(name,data,labelPrefix);});
    poly.addTo(group);

    data.stops.forEach(function(s){
      L.circleMarker([s.lat,s.lng],{
        radius:4,color:data.color,fillColor:'#0f172a',fillOpacity:1,weight:2,interactive:true
      }).bindTooltip('<b>'+s.n+'</b><br>'+labelPrefix+name,{direction:'top'})
        .on('click',function(){showStaticPanel(name,data,labelPrefix);})
        .addTo(group);
    });

    if(legendEl){
      const div=document.createElement('div');
      div.className='li';
      div.innerHTML='<div class="lc" style="background:'+data.color+'"></div>'+
        '<span>'+labelPrefix+name+'</span>';
      div.onclick=function(){map.fitBounds(L.polyline(coords).getBounds(),{padding:[30,30]});};
      legendEl.appendChild(div);
    }
  });
}

// ── SAE LINES ─────────────────────────────────────────────────────────────────
function buildSAE(){
  saeItems.forEach(function(it){
    groups.safran.removeLayer(it.poly);
    it.markers.forEach(function(m){groups.safran.removeLayer(m);});
  });
  saeItems=[];
  const search=filters.search.toLowerCase();

  SAE_LINES.forEach(function(line){
    if(filters.dir!=='all'&&line.dir!==filters.dir)return;
    if(filters.type!=='all'&&line.type!==filters.type)return;
    if(search){
      const nm=line.name.toLowerCase().includes(search);
      const sm=line.stops.some(function(sid){
        const st=SAE_STOPS[String(sid)];return st&&st[2].toLowerCase().includes(search);
      });
      if(!nm&&!sm)return;
    }
    const rc=SAE_ROUTES[String(line.id)];
    if(!rc||rc.length<2)return;
    const ll=rc.map(function(c){return[c[1],c[0]];});
    const isEquipe=line.type==='equipe';
    const poly=L.polyline(ll,{
      color:line.color,weight:isEquipe?2:3,opacity:isEquipe?0.6:0.9,
      dashArray:isEquipe?'8 4':null,interactive:true
    });
    const tip='<b>'+line.name+'</b><br>'+(isEquipe?'<i>Équipe</i>':'<i>Normale</i>')+
      ' · '+(line.dir==='aller'?'↗ Aller':'↙ Retour')+'<br>🕐 '+line.dep_time+' → '+line.ret_time;
    poly.bindTooltip(tip,{sticky:true,direction:'top'});
    poly.on('click',function(){showLinePanel(line);});
    poly.addTo(groups.safran);

    const markers=[];
    // endpoint stops always visible
    [line.stops[0],line.stops[line.stops.length-1]].forEach(function(sid){
      const st=SAE_STOPS[String(sid)];if(!st)return;
      const hub=st[2].includes('Réau')||st[2].includes('Villaroche');
      const m=L.circleMarker([st[0],st[1]],{
        radius:hub?8:5,color:hub?'#fff':line.color,
        fillColor:hub?'#f59e0b':line.color,fillOpacity:1,weight:hub?2:1.5
      });
      m.bindTooltip('<b>'+st[2]+'</b><br>'+line.name,{direction:'top'});
      m.on('click',function(e){L.DomEvent.stopPropagation(e);showLinePanel(line);});
      m.addTo(groups.safran);
      markers.push(m);
    });
    // intermediate stops shown at zoom ≥ 12
    line.stops.slice(1,-1).forEach(function(sid,i){
      const st=SAE_STOPS[String(sid)];if(!st)return;
      const m=L.circleMarker([st[0],st[1]],{
        radius:3,color:line.color,fillColor:'#1e293b',fillOpacity:1,weight:1.5
      });
      m.bindTooltip('<b>'+st[2]+'</b><br>'+(line.times[i+1]||''),{direction:'top'});
      m.on('click',function(e){L.DomEvent.stopPropagation(e);showLinePanel(line);});
      function upd(){
        if(map.getZoom()>=12){if(!groups.safran.hasLayer(m))m.addTo(groups.safran);}
        else{if(groups.safran.hasLayer(m))groups.safran.removeLayer(m);}
      }
      map.on('zoomend',upd);upd();
      markers.push(m);
    });
    saeItems.push({line,poly,markers});
  });
  rebuildSAELegend();
}

function rebuildSAELegend(){
  const el=document.getElementById('sae-legend');el.innerHTML='';
  const seen=new Set();
  saeItems.forEach(function(it){
    const l=it.line;
    const key=l.name.split('(')[0].trim();
    if(seen.has(key))return;seen.add(key);
    const div=document.createElement('div');div.className='li';
    div.innerHTML='<div class="lc" style="background:'+l.color+'"></div>'+
      '<span style="color:'+(l.dir==='aller'?'#86efac':'#fca5a5')+';margin-right:2px">'+(l.dir==='aller'?'↗':'↙')+'</span>'+
      l.name.replace(/ALLER|RETOUR/g,'').trim();
    div.onclick=function(){
      const it2=saeItems.find(function(x){return x.line.id===l.id;});
      if(it2){map.fitBounds(it2.poly.getBounds(),{padding:[20,20]});showLinePanel(l);}
    };
    el.appendChild(div);
  });
}

// ── PANELS ────────────────────────────────────────────────────────────────────
function showLinePanel(line){
  document.getElementById('ptitle').innerHTML=
    '<span class="badge" style="background:'+line.color+';color:#000">'+(line.type==='equipe'?'ÉQUIPE':'NORMALE')+'</span> '+
    '<span style="color:'+(line.dir==='aller'?'#86efac':'#fca5a5')+'">'+(line.dir==='aller'?'↗ ALLER':'↙ RETOUR')+'</span><br>'+line.name;
  let h='<div style="margin-bottom:8px;font-size:11px;color:#94a3b8">'+
    '📍 <b>Départ:</b> '+line.dep+'<br>🏁 <b>Arrivée:</b> '+line.ret+
    '<br>🕐 '+line.dep_time+' → '+line.ret_time+'</div>'+
    '<div style="font-size:10px;color:#64748b;margin-bottom:5px">'+line.stops.length+' arrêts</div>';
  line.stops.forEach(function(sid,i){
    const st=SAE_STOPS[String(sid)];
    h+='<div class="stop-row"><span class="sname">'+(i+1)+'. '+(st?st[2]:'#'+sid)+'</span>'+
       '<span class="stime">'+(line.times[i]||'')+'</span></div>';
  });
  document.getElementById('pbody').innerHTML=h;
  document.getElementById('panel').style.display='block';
}

function showStaticPanel(name,data,prefix){
  document.getElementById('ptitle').innerHTML=prefix+name;
  let h='<div style="font-size:10px;color:#64748b;margin-bottom:5px">'+data.stops.length+' arrêts</div>';
  data.stops.forEach(function(s,i){
    h+='<div class="stop-row"><span class="sname">'+(i+1)+'. '+s.n+'</span></div>';
  });
  document.getElementById('pbody').innerHTML=h;
  document.getElementById('panel').style.display='block';
}

window.closePanel=function(){document.getElementById('panel').style.display='none';};
map.on('click',function(){closePanel();});

// ── FILTERS ───────────────────────────────────────────────────────────────────
window.setFilter=function(key,val,btn){
  filters[key]=val;
  btn.parentElement.querySelectorAll('.fbtn').forEach(function(b){
    if(b.getAttribute('onclick')&&b.getAttribute('onclick').includes("'"+key+"'")){
      b.classList.toggle('active',b===btn);
    }
  });
  buildSAE();
};
window.onSearch=function(v){filters.search=v;buildSAE();};
window.toggleLayer=function(name,btn){
  layerVis[name]=!layerVis[name];
  if(layerVis[name]){groups[name].addTo(map);btn.classList.replace('off','on');}
  else{map.removeLayer(groups[name]);btn.classList.replace('on','off');}
};

// ── INIT ──────────────────────────────────────────────────────────────────────
buildSAE();
drawStaticLines(RER_DATA,   groups.rer,   document.getElementById('rer-legend'),   'RER ',    4, null);
drawStaticLines(TRANS_DATA, groups.trans, document.getElementById('trans-legend'), 'Ligne ',  3, '10 5');
drawStaticLines(METRO_DATA, groups.metro, document.getElementById('metro-legend'), 'Métro ',  2.5, '5 3');
</script>
